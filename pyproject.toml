[project]
name = "pyclisteno"
version = "0.8.0"
description = "Learned shortcut, hint, and completion layer for Python CLIs"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["cli", "click", "typer", "completion", "shortcuts", "abbreviation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# 3.11 is the tomllib floor, and reading the user's pin file without a TOML
# dependency is what keeps the dependency list empty.
requires-python = ">=3.11"

# No runtime dependencies, click included. Walking click to cover typer as well
# stopped working at typer 0.27, which vendors its own complete copy of click
# sharing no base class with the installed one — so the walk matches on the shape
# both expose rather than on either one's classes, and needs neither installed.
# See the module docstring in walk.py.
dependencies = []

[project.urls]
Repository = "https://github.com/datapointchris/pyclisteno"
Issues = "https://github.com/datapointchris/pyclisteno/issues"
Changelog = "https://github.com/datapointchris/pyclisteno/releases"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "click>=8.1",
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "typer>=0.12.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
build_command = """
    pip install uv
    uv lock --upgrade-package pyclisteno
    git add uv.lock
"""

[tool.ruff]
line-length = 140

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.codespell]
check-filenames = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2

[tool.forge]
# Keys the standard owns, written by `forge repos apply pyproject`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyclisteno"
module-root = "src"
