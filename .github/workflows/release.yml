name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # python-semantic-release decides the version, writes it into pyproject.toml,
  # tags, and creates the GitHub release.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: python-semantic-release/python-semantic-release@v9
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # The PyPI publish job is deliberately absent while the distribution channel
  # is undecided. pyselfupdate's version of this workflow has it, and restoring
  # it is a copy from there -- but it must not be added back before Trusted
  # Publishing is configured on PyPI, because the job fails on the first release
  # otherwise and every push to main goes red.
  #
  # When it is restored, two things about its shape are not obvious and should
  # survive the copy. It belongs in THIS workflow rather than one keyed on
  # `release: published` or `push: tags`, because a tag pushed with
  # GITHUB_TOKEN does not trigger another workflow run and such a job would
  # simply never fire. And it belongs in a SEPARATE job, because publishing
  # needs `id-token: write` for OIDC and the version job must not have it.
  #
  # Until then: consumers take this library as a git dependency against a tag.
  # The version job above still tags and creates the GitHub release, so there
  # is something to pin to.
